      <h1 data-en="Welcome to CSE 2027" data-fr="Bienvenue à la CDDI 2027"></h1>
      <p data-en="Join us for the Conference on Sustainability in Engineering (CSE), hosted at McGill University in Montréal. This national event is dedicated to empowering the next generation of engineers to lead with responsibility and innovation. Over four days, you'll connect with passionate peers, attend thought-provoking talks, and participate in hands-on workshops—all focused on building a more sustainable future together."
         data-fr="Participez au Congrès sur le développement durable en ingénierie (CDDI), organisé à l'Université McGill à Montréal. Cet événement national vise à outiller la prochaine génération d’ingénieur·e·s pour qu’elle innove et agisse avec responsabilité. Pendant quatre jours, rencontrez des pairs engagé·e·s, assistez à des conférences inspirantes et prenez part à des ateliers pratiques, tous axés sur la construction d’un avenir plus durable.">
      </p>

<section class="hero">
  <div class="container">
    <h2 data-en="Land Acknowledgement" data-fr="Reconnaissance Territoriale"></h2>

    <p data-en="We would like to begin by acknowledging that McGill University is situated on unceded Indigenous lands. Indeed, Tiohtià:ke/Montreal lies on the traditional territory of the Kanien’kehà:ka, a place which has long served as a site of meeting and exchange amongst many First Nations including the Kanien’kehá:ka of the Haudenosaunee Confederacy, Huron/Wendat, Abenaki, and Anishinaabeg. We respect and recognize the Kanien’kehà:ka as the traditional custodians of the lands and waters on which we meet today, and honour their enduring connection to this land."
       data-fr="Nous aimerions commencer en reconnaissant que l’université McGill est située sur des territoires autochtones non-cédés. Tiohtià:ke/Montreal se trouve sur le territoire traditionnel des Kanien’kehà:ka, un endroit qui sert depuis longtemps comme lieu de rencontre et d’échange entre de nombreuses Premières nations, incluant les Kanien’kehà:ka de la Confédération Haudenosaunis, les Hurons/Wendat, les Abénaquis et les Anishinaabeg. Nous reconnaissons et respectons les Kanien’kehà:ka en tant que gardiens traditionnels des terres et des eaux sur lesquelles nous nous rencontrons aujourd’hui, et nous honorons leurs liens avec cette terre.">
    </p>

    <p data-en="Today, Indigenous communities continue to be under-represented in discussions about sustainability, despite disproportionately experiencing the effects of climate change. We commit to working in unison with the original stewards of this land and amplifying their voices and knowledge, which have preserved these lands for centuries. In acknowledging the history of colonialism that created the structures upholding systemic discrimination today, each of us are reminded that we bear a responsibility to create an environment that is equitable and inclusive to all."
       data-fr="Aujourd’hui, les communautés autochtones continuent d’être sous-représentées dans les discussions de développement durable, mais subissent de manière disproportionnée les effets du changement climatique. Nous nous engageons à travailler à l’unisson avec les premiers intendants de cette terre et à amplifier leurs voix et leurs connaissances, qui ont préservé ces terres pendant des siècles. En reconnaissant l’histoire du colonialisme qui a créé les structures soutenant la discrimination systémique aujourd’hui, nous rappelons à chacun d’entre nous qu’il est notre responsabilité de créer un environnement équitable et inclusif pour tous.">
    </p>
  </div>
